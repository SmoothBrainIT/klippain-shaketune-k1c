services:
  shaketune:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8080:8080"
    environment:
      # Optional API key for authentication. Leave empty to disable auth (local network use).
      - SHAKETUNE_API_KEY=${SHAKETUNE_API_KEY:-}
      # Optional: path to a Klipper source tree for shaper_calibrate access.
      # Mount your local Klipper clone here to use the same version as your printer.
      - KLIPPER_DIR=/klipper
    volumes:
      # Optional: mount your Klipper source for shaper_calibrate (input shaper + belts graphs).
      # Set KLIPPER_PATH in a .env file or environment, e.g.:
      #   echo "KLIPPER_PATH=/home/taylor/klipper" >> docker/.env
      # Tilde (~) does not expand correctly under `sudo docker compose` — use absolute path.
      - ${KLIPPER_PATH:-/nonexistent}:/klipper:ro
      # Optional: persist debug graphs between container restarts
      - shaketune_results:/tmp/shaketune_results
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  shaketune_results:
