name: Build MIPS32 zstandard Wheel (K1C)

# Builds a zstandard Python 3.8 wheel for mipsel (MIPS32 little-endian),
# targeting the Creality K1C (Ingenic X2000E, GLIBC 2.29).
#
# Strategy (native build in chroot):
#
#  Phase 1: debootstrap Debian Buster mipsel chroot.
#    Debian 10 (Buster) ships glibc 2.28, which is compatible with K1C.
#
#  Phase 2: build Python 3.8 inside the Buster chroot and build the wheel
#    natively under QEMU. This prevents host (Ubuntu 22.04) glibc 2.34+
#    symbol leakage that breaks on K1C.
#
# Outputs:
#   - GitHub Actions artifact: zstandard-mipsel-cp38
#   - On release: attached as zstandard-mips32.whl (expected by install_k1c.sh)

on:
  workflow_dispatch:
  release:
    types: [created]

jobs:
  build-mipsel-wheel:
    name: Build zstandard mipsel cp38 wheel
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      # -----------------------------------------------------------------------
      # 1. Install tools
      # -----------------------------------------------------------------------
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            debootstrap \
            qemu-user-static \
            binfmt-support \
            gcc-mipsel-linux-gnu \
            g++-mipsel-linux-gnu \
            binutils-mipsel-linux-gnu

          echo "QEMU mipsel:"
          ls /usr/bin/qemu-mipsel-static
          echo "mipsel compiler:"
          mipsel-linux-gnu-gcc --version | head -1

      # -----------------------------------------------------------------------
      # 2. Bootstrap Debian Buster MIPSEL chroot
      #    Buster is archived at archive.debian.org (EOL June 2024).
      # -----------------------------------------------------------------------
      - name: Bootstrap Debian Buster MIPSEL rootfs
        run: |
          sudo mkdir -p /mnt/mipsel-root
          sudo debootstrap \
            --arch=mipsel \
            --foreign \
            --no-check-gpg \
            --variant=minbase \
            buster \
            /mnt/mipsel-root \
            http://archive.debian.org/debian
          sudo cp /usr/bin/qemu-mipsel-static /mnt/mipsel-root/usr/bin/
          sudo chroot /mnt/mipsel-root /debootstrap/debootstrap --second-stage
          echo "Chroot arch: $(sudo chroot /mnt/mipsel-root uname -m)"
        timeout-minutes: 20

      # -----------------------------------------------------------------------
      # 3. Install build deps inside the Buster mipsel chroot
      # -----------------------------------------------------------------------
      - name: Install build deps in Buster chroot
        run: |
          sudo tee /mnt/mipsel-root/etc/apt/sources.list > /dev/null << 'EOF'
          deb http://archive.debian.org/debian buster main
          EOF
          sudo tee /mnt/mipsel-root/etc/apt/apt.conf.d/99no-check-valid-until > /dev/null << 'EOF'
          Acquire::Check-Valid-Until "false";
          EOF

          sudo chroot /mnt/mipsel-root apt-get update -qq 2>&1 | tail -3
          sudo chroot /mnt/mipsel-root apt-get install -y --no-install-recommends \
            build-essential \
            wget \
            ca-certificates \
            xz-utils \
            pkg-config \
            libssl-dev \
            zlib1g-dev \
            libbz2-dev \
            libreadline-dev \
            libsqlite3-dev \
            libffi-dev \
            liblzma-dev \
            libncursesw5-dev \
            uuid-dev \
            tk-dev \
            libgdbm-dev \
            libnss3-dev 2>&1 | tail -5

      # -----------------------------------------------------------------------
      # 4. Build Python 3.8 inside the mipsel chroot
      # -----------------------------------------------------------------------
      - name: Build Python 3.8 in Buster chroot
        run: |
          sudo chroot /mnt/mipsel-root /bin/bash -lc '
            set -e
            PY_VER=3.8.2
            cd /tmp
            wget -q https://www.python.org/ftp/python/${PY_VER}/Python-${PY_VER}.tgz
            tar -xf Python-${PY_VER}.tgz
            cd Python-${PY_VER}
            ./configure --prefix=/opt/python3.8 --with-ensurepip=install
            make -j2
            make install
            /opt/python3.8/bin/python3.8 --version
            /opt/python3.8/bin/python3.8 -m pip install --upgrade pip setuptools wheel cffi packaging
          '

      # -----------------------------------------------------------------------
      # 5. Build zstandard 0.23.0 inside the chroot (native mipsel wheel)
      # -----------------------------------------------------------------------
      - name: Build zstandard wheel in Buster chroot
        run: |
          sudo chroot /mnt/mipsel-root /bin/bash -lc '
            set -e
            mkdir -p /tmp/mipsel-wheels
            /opt/python3.8/bin/python3.8 -m pip wheel zstandard==0.23.0 \
              --no-binary :all: \
              --no-deps \
              -w /tmp/mipsel-wheels/
            echo "=== Built wheels (chroot) ==="
            ls -lh /tmp/mipsel-wheels/
          '

          mkdir -p /tmp/mipsel-wheels
          sudo cp /mnt/mipsel-root/tmp/mipsel-wheels/*.whl /tmp/mipsel-wheels/

      # -----------------------------------------------------------------------
      # 6. Verify the wheel contains a MIPSEL binary with acceptable GLIBC reqs
      # -----------------------------------------------------------------------
      - name: Verify wheel architecture
        run: |
          WHEEL=$(ls /tmp/mipsel-wheels/zstandard-*.whl | head -1)
          echo "Wheel: $WHEEL"

          mkdir -p /tmp/wheel-check
          cd /tmp/wheel-check
          unzip -q "$WHEEL"

          SO_FILE=$(find . -name "*.so" | head -1)
          if [ -n "$SO_FILE" ]; then
            echo "Shared library: $SO_FILE"
            file "$SO_FILE"
            echo "=== Dynamic dependencies ==="
            mipsel-linux-gnu-objdump -p "$SO_FILE" 2>/dev/null \
              | grep -E "GLIBC|NEEDED|file format" || true
            echo "=== GLIBC symbol versions used ==="
            mipsel-linux-gnu-objdump -T "$SO_FILE" 2>/dev/null \
              | grep "GLIBC" | awk '{print $NF, $(NF-1)}' | sort -u || true
            MAX_GLIBC=$(mipsel-linux-gnu-objdump -T "$SO_FILE" 2>/dev/null \
              | grep -o "GLIBC_[0-9.]*" | sort -V | tail -1)
            echo "Max GLIBC required: ${MAX_GLIBC:-none}"
            if [ -n "$MAX_GLIBC" ]; then
              if [ "$(printf '%s\n' "GLIBC_2.29" "$MAX_GLIBC" | sort -V | tail -1)" != "GLIBC_2.29" ]; then
                echo "ERROR: GLIBC requirement too new (must be <= GLIBC_2.29)"
                exit 1
              fi
            fi
            if ! echo "$SO_FILE" | grep -q "cpython-38-mipsel-linux-gnu.so"; then
              echo "ERROR: Unexpected EXT_SUFFIX in .so filename"
              exit 1
            fi
          else
            echo "ERROR: No .so file found in wheel"
            find . -type f
            exit 1
          fi

      # -----------------------------------------------------------------------
      # 7. Rename to canonical name expected by install_k1c.sh
      # -----------------------------------------------------------------------
      - name: Rename wheel for install_k1c.sh
        run: |
          WHEEL=$(ls /tmp/mipsel-wheels/zstandard-*.whl | head -1)
          cp "$WHEEL" /tmp/mipsel-wheels/zstandard-mips32.whl
          echo "Original : $(basename $WHEEL)"
          echo "Canonical: zstandard-mips32.whl"
          ls -lh /tmp/mipsel-wheels/

      # -----------------------------------------------------------------------
      # 8. Upload as workflow artifact
      # -----------------------------------------------------------------------
      - name: Upload wheel as artifact
        uses: actions/upload-artifact@v4
        with:
          name: zstandard-mipsel-cp38
          path: /tmp/mipsel-wheels/zstandard-*.whl
          if-no-files-found: error
          retention-days: 90

      # -----------------------------------------------------------------------
      # 9. Attach to GitHub Release
      # -----------------------------------------------------------------------
      - name: Upload wheel to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: /tmp/mipsel-wheels/zstandard-mips32.whl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
