name: Build MIPS32 zstandard Wheel (K1C)

# Builds a zstandard Python 3.8 wheel for mipsel (MIPS32 little-endian),
# targeting the Creality K1C (Ingenic X2000E, GLIBC ~2.26).
#
# Strategy: debootstrap creates a real Debian Buster mipsel chroot.
# Debian 10 (Buster) officially supports mipsel and has Python 3.8 in
# buster-backports. pip runs natively inside the chroot via QEMU user-mode
# emulation, so the resulting wheel is a genuine mipsel cp38 binary.
#
# Outputs:
#   - GitHub Actions artifact: zstandard-mipsel-cp38
#   - On release: attached as zstandard-mips32.whl (the name install_k1c.sh expects)
#
# The install script downloads:
#   https://github.com/SmoothBrainIT/klippain-shaketune-k1c/releases/latest/download/zstandard-mips32.whl

on:
  workflow_dispatch:
  release:
    types: [created]

jobs:
  build-mipsel-wheel:
    name: Build zstandard mipsel wheel in Debian Buster chroot
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      # -----------------------------------------------------------------------
      # 1. Install debootstrap + QEMU mipsel emulation
      #    qemu-user-static + binfmt-support registers binfmt handlers
      #    automatically so the kernel transparently runs MIPS binaries.
      # -----------------------------------------------------------------------
      - name: Install debootstrap and QEMU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            debootstrap \
            qemu-user-static \
            binfmt-support \
            binutils-mipsel-linux-gnu

          echo "binfmt handlers registered:"
          ls /proc/sys/fs/binfmt_misc/ 2>/dev/null | grep -v register || echo "(none)"
          ls /usr/bin/qemu-mipsel-static && echo "qemu-mipsel-static: OK"

      # -----------------------------------------------------------------------
      # 2. Bootstrap a minimal Debian Buster mipsel rootfs
      #    Debian 10 (Buster) officially supported mipsel. It is archived at
      #    archive.debian.org since it reached EOL in June 2024.
      #    --foreign + second-stage: required for cross-arch bootstrapping.
      # -----------------------------------------------------------------------
      - name: Bootstrap Debian Buster MIPSEL rootfs (first stage)
        run: |
          sudo mkdir -p /mnt/mipsel-root
          sudo debootstrap \
            --arch=mipsel \
            --foreign \
            --no-check-gpg \
            --variant=minbase \
            buster \
            /mnt/mipsel-root \
            http://archive.debian.org/debian

          echo "First stage complete, copying QEMU static binary..."
          sudo cp /usr/bin/qemu-mipsel-static /mnt/mipsel-root/usr/bin/
          echo "QEMU binary in chroot: $(ls -lh /mnt/mipsel-root/usr/bin/qemu-mipsel-static)"
        timeout-minutes: 10

      - name: Bootstrap Debian Buster MIPSEL rootfs (second stage via QEMU)
        run: |
          sudo chroot /mnt/mipsel-root /debootstrap/debootstrap --second-stage
          echo "Second stage complete"
          sudo chroot /mnt/mipsel-root uname -m
        timeout-minutes: 10

      # -----------------------------------------------------------------------
      # 3. Configure APT: add buster-backports for Python 3.8
      #    Python 3.8 is in buster-backports (Buster default is Python 3.7).
      # -----------------------------------------------------------------------
      - name: Configure APT sources in chroot
        run: |
          sudo tee /mnt/mipsel-root/etc/apt/sources.list > /dev/null << 'EOF'
          deb http://archive.debian.org/debian buster main
          deb http://archive.debian.org/debian-security buster/updates main
          deb http://archive.debian.org/debian buster-backports main
          EOF

          # Silence "apt doesn't support phased updates" warnings on archived repos
          sudo tee /mnt/mipsel-root/etc/apt/apt.conf.d/99phased > /dev/null << 'EOF'
          APT::Get::Always-Include-Phased-Updates "true";
          EOF

          sudo chroot /mnt/mipsel-root apt-get update -qq 2>&1 | tail -5

      # -----------------------------------------------------------------------
      # 4. Install Python 3.8 from buster-backports + pip + gcc
      # -----------------------------------------------------------------------
      - name: Install Python 3.8 in chroot
        run: |
          sudo chroot /mnt/mipsel-root bash -c "
            export DEBIAN_FRONTEND=noninteractive
            apt-get install -y --no-install-recommends \
              -t buster-backports \
              python3.8 python3.8-dev python3-pip gcc make
          "
          echo "Python version in chroot:"
          sudo chroot /mnt/mipsel-root python3.8 --version
          sudo chroot /mnt/mipsel-root python3.8 -c "import sys, platform; print(sys.version); print(platform.machine())"
        timeout-minutes: 10

      # -----------------------------------------------------------------------
      # 5. Build the zstandard wheel inside the MIPSEL chroot
      #    pip runs the native MIPS Python 3.8 binary via QEMU, so the
      #    resulting .so is genuine mipsel and tagged cp38-cp38-linux_mipsel.
      # -----------------------------------------------------------------------
      - name: Build zstandard 0.23.0 wheel
        run: |
          sudo mkdir -p /mnt/mipsel-root/out

          sudo chroot /mnt/mipsel-root bash -c "
            pip3 install --quiet --upgrade pip wheel setuptools
            echo '=== Building zstandard 0.23.0 ==='
            pip3.8 wheel zstandard==0.23.0 \
              --no-binary :all: \
              --no-deps \
              -w /out/
          "

          echo "=== Built wheels ==="
          ls -lh /mnt/mipsel-root/out/
        timeout-minutes: 15

      # -----------------------------------------------------------------------
      # 6. Collect wheel + sanity check
      # -----------------------------------------------------------------------
      - name: Verify wheel architecture
        run: |
          WHEEL=$(ls /mnt/mipsel-root/out/zstandard-*.whl | head -1)
          echo "Wheel: $WHEEL"
          cp "$WHEEL" /tmp/

          mkdir -p /tmp/wheel-check
          cd /tmp/wheel-check
          unzip -q "$WHEEL"

          SO_FILE=$(find . -name "*.so" | head -1)
          if [ -n "$SO_FILE" ]; then
            echo "Shared library: $SO_FILE"
            file "$SO_FILE"
            mipsel-linux-gnu-objdump -p "$SO_FILE" | grep -E "GLIBC|NEEDED|file format" || true
          else
            echo "WARNING: No .so file found in wheel"
            find . -type f
            exit 1
          fi

      # -----------------------------------------------------------------------
      # 7. Rename to canonical name expected by install_k1c.sh
      # -----------------------------------------------------------------------
      - name: Rename wheel for install_k1c.sh
        run: |
          WHEEL=$(ls /tmp/zstandard-*.whl | head -1)
          cp "$WHEEL" /tmp/zstandard-mips32.whl
          echo "Original : $(basename $WHEEL)"
          echo "Canonical: zstandard-mips32.whl"
          ls -lh /tmp/zstandard-*.whl

      # -----------------------------------------------------------------------
      # 8. Upload as workflow artifact
      # -----------------------------------------------------------------------
      - name: Upload wheel as artifact
        uses: actions/upload-artifact@v4
        with:
          name: zstandard-mipsel-cp38
          path: /tmp/zstandard-*.whl
          if-no-files-found: error
          retention-days: 90

      # -----------------------------------------------------------------------
      # 9. Attach to GitHub Release (only when triggered by a release event)
      # -----------------------------------------------------------------------
      - name: Upload wheel to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: /tmp/zstandard-mips32.whl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
